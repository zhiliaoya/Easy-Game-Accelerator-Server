# ============ 编译配置 ============

# 使用人数（1-3）
users = 3

# 监听端口（默认 8206，可改为其他端口如 8443）
port = 8206

# yaml文件配置中的连接模式：ip（自动获取服务器的IP地址, domain可以为空） 或 domain（domain需要直接填写域名，不用自动获取服务器的IP地址）
mode = ip
domain = 

# 存储模式：none（无存储） 或 sql（SQLite 持久化）
storage = sql

# REALITY 伪装域名（SNI）
server_name = www.bing.com

# 节点名称前缀（会自动追加 -1/-2/-3）
proxy_name = ZhiLiaoYa-Game-VLESS

# ============ 健康检查 API ============
api_enabled = true
api_listen = 127.0.0.1
api_port = 8207